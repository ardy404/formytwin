<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Visitor Dashboard</title><link rel="stylesheet" href="admin.css">
<script src="analytics-config.js"></script></head><body>
<header><div><p class="eyebrow">PRIVATE ADMIN</p><h1>Visitor Dashboard</h1><p class="sub">Visits recorded only after the visitor opens the consent prompt. IP is supplied by the server; location comes from browser permission.</p></div><div class="actions"><button id="refresh">↻ Refresh</button><button id="clear" class="danger">Clear all</button></div></header>
<main><section class="stats"><div><span>Total visits</span><strong id="total">—</strong></div><div><span>Location shared</span><strong id="located">—</strong></div><div><span>Unique IPs</span><strong id="ips">—</strong></div><div><span>Last visit</span><strong id="last">—</strong></div></section>
<section class="panel"><div class="toolbar"><input id="search" placeholder="Search IP, device, timezone…"><button id="export">Export CSV</button></div><div class="table-wrap"><table><thead><tr><th>Time</th><th>IP</th><th>Latitude</th><th>Longitude</th><th>Accuracy</th><th>Device / browser</th><th>Timezone</th><th>Location</th></tr></thead><tbody id="rows"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody></table></div></section></main>
<script>
let visits=[];
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function device(ua){if(/iPhone|iPad|iPod/i.test(ua)) return 'Apple mobile'; if(/Android/i.test(ua)) return 'Android'; if(/Windows/i.test(ua)) return 'Windows'; if(/Mac OS X/i.test(ua)) return 'macOS'; if(/Linux/i.test(ua)) return 'Linux'; return 'Unknown';}
function render(){const q=$('search').value.toLowerCase(); const filtered=visits.filter(v=>(v.ip+' '+v.userAgent+' '+(v.timezone||'')).toLowerCase().includes(q)); $('total').textContent=visits.length; $('located').textContent=visits.filter(v=>v.locationGranted&&v.latitude!==null).length; $('ips').textContent=new Set(visits.map(v=>v.ip)).size; $('last').textContent=visits[0]?new Date(visits[0].timestamp).toLocaleString():'—'; $('rows').innerHTML=filtered.length?filtered.map(v=>`<tr><td>${esc(new Date(v.timestamp).toLocaleString())}</td><td><code>${esc(v.ip)}</code></td><td>${v.latitude==null?'—':Number(v.latitude).toFixed(6)}</td><td>${v.longitude==null?'—':Number(v.longitude).toFixed(6)}</td><td>${v.accuracy==null?'—':Math.round(v.accuracy)+' m'}</td><td><strong>${esc(device(v.userAgent))}</strong><small>${esc(v.userAgent)}</small></td><td>${esc(v.timezone||'—')}</td><td>${v.locationGranted?'✓ Shared':'Not shared'}</td></tr>`).join(''):'<tr><td colspan="8" class="empty">No matching visits.</td></tr>';}
async function load(){try{const r=await fetch((window.ANALYTICS_API_BASE || '') + '/api/visits',{cache:'no-store'}); if(!r.ok) throw new Error(); visits=await r.json(); render();}catch(e){$('rows').innerHTML='<tr><td colspan="8" class="empty">Could not load data. Check the admin login/server.</td></tr>';}}
$('refresh').onclick=load; $('search').oninput=render; $('clear').onclick=async()=>{if(confirm('Delete every recorded visit?')){await fetch((window.ANALYTICS_API_BASE || '') + '/api/clear',{method:'POST'});load();}};
$('export').onclick=()=>{const cols=['timestamp','ip','latitude','longitude','accuracy','locationGranted','timezone','language','userAgent','referrer']; const csv=[cols.join(','),...visits.map(v=>cols.map(k=>'"'+String(v[k]??'').replaceAll('"','""')+'"').join(','))].join('\n'); const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='visitor-data.csv';a.click();}; load();
</script></body></html>
